# ============================================================
# Cargo.toml - Tauri 2.x 桌面客户端
# ============================================================
# 升级到 Tauri 2.x 原因：
#   Ubuntu 26.04 仓库已移除 webkit2gtk-4.0 / libsoup-2.4，
#   仅保留 webkit2gtk-4.1 / libsoup-3.0；
#   Tauri 1.x 强依赖 wry 0.24 -> webkit2gtk-4.0，无法编译。
#   Tauri 2.x 使用 wry 0.40+，原生支持 webkit2gtk-4.1。
# ============================================================

[package]
name = "chat-client"
version = "1.0.0"
description = "Tauri 2 桌面聊天室客户端 - 对接 muduo C++ 服务端"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# ---------- 库目标：Tauri 代码放入 lib.rs ----------
# Tauri 2.x 不再强制要求 lib 名称为 "app"，可自定义
[lib]
name = "chat_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

# ---------- 二进制入口：调用 chat_client_lib::run() ----------
[[bin]]
name = "chat-client"
path = "src/main.rs"

[dependencies]
# Tauri 2：features 留空（IPC/Tauri Command/事件等核心能力默认开启）；
# 旧版的 "dialog-all"/"shell-open"/"window-all" 在 2.x 中改为插件，
# 当前代码未使用插件，留空即可
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.12"
prost-types = "0.12"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

# Protobuf 编译时生成 Rust 代码（build-dependencies）
[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
