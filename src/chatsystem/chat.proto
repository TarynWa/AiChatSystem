syntax = "proto3";
package chat;

// 主消息类型枚举
// proto3规范：enum首项必须为0，此处使用MSG_NONE作为占位/未知类型
// 后续业务枚举值递增分配，新增业务请按既定规律追加，禁止复用历史值
enum EnMsgType {
    MSG_NONE = 0;              // 占位/未知消息，proto3首项必须为0
    LOGIN_MSG = 1;             // 登录请求
    LOGIN_MSG_ACK = 2;         // 登录响应
    LOGINOUT_MSG = 3;          // 注销消息
    REG_MSG = 4;               // 注册请求
    REG_MSG_ACK = 5;           // 注册响应
    ONE_CHAT_MSG = 6;          // 一对一私聊
    ONE_CHAT_MSG_ACK = 7;      // 一对一私聊回执
    ADD_FRIEND_MSG = 8;        // 添加好友
    ADD_FRIEND_MSG_ACK = 9;    // 添加好友响应
    DEL_FRIEND_MSG = 10;       // 删除好友
    DEL_FRIEND_MSG_ACK = 11;   // 删除好友响应
    CREATE_GROUP_MSG = 12;     // 创建群组
    CREATE_GROUP_MSG_ACK = 13; // 创建群组响应
    ADD_GROUP_MSG = 14;        // 加入群组
    ADD_GROUP_MSG_ACK = 15;    // 加入群组响应
    QUIT_GROUP_MSG = 16;       // 退出群组
    QUIT_GROUP_MSG_ACK = 17;   // 退出群组响应
    GROUP_CHAT_MSG = 18;       // 群聊天
    GROUP_CHAT_MSG_ACK = 19;   // 群聊天回执
    CROSS_NODE_CHAT_MSG = 20;  // 跨节点消息转发（Redis Pub/Sub传输载体）
}

// 通信外层信封
// type标识业务类型，payload承载具体业务消息序列化字节
message BaseMessage {
    EnMsgType type = 1;
    bytes payload = 2;
}

// 登录请求消息
// last_ack_seq：客户端登录时回传最后已确认的seq，供服务端决定从何处开始投递离线消息
message LoginRequest {
    string username = 1;
    string password = 2;
    int64 id = 3;
    int32 last_ack_seq = 4;   // 客户端已确认的最大seq（断线重连同步水位）
}

// 注册请求消息（id字段由服务端分配，客户端传入将被忽略）
message RegisterRequest {
    string username = 1;
    string password = 2;
    int64 id = 3;
}

// 注册响应消息
// code错误码体系：0成功，1参数非法，2用户名已存在，3数据库写入失败
message RegisterResponse {
    int64 code = 1;             // 错误码
    string msg = 2;             // 描述信息
    int64 id = 3;               // 注册成功后服务端分配的用户ID（失败时为-1）
}

// ========== 一对一私聊 ==========
// msg_id：客户端生成的全局唯一幂等键（雪花算法），用于服务端去重
// seq：每发送方单调递增，接收方按seq重排，断线重连后不重置
message OneChatRequest {
    int64 from_id = 1;          // 发送方用户ID
    int64 to_id = 2;            // 接收方用户ID
    string content = 3;         // 消息内容
    int64 timestamp = 4;        // 消息时间戳（毫秒）
    int64 msg_id = 5;           // 幂等键：客户端生成的全局唯一ID
    int32 seq = 6;              // 顺序键：每发送方单调递增
}

message OneChatAck {
    int64 code = 1;
    string msg = 2;
    int64 msg_id = 3;           // 回传msg_id，便于客户端匹配ACK
    int32 seq = 4;              // 回传seq，便于客户端推进watermark
}

// ========== 好友管理 ==========
message AddFriendRequest {
    int64 from_id = 1;          // 发起方用户ID
    int64 to_id = 2;            // 被添加好友ID
    int64 msg_id = 3;           // 幂等键
    int32 seq = 4;              // 顺序键
}

message AddFriendAck {
    int64 code = 1;
    string msg = 2;
    int64 msg_id = 3;
    int32 seq = 4;
}

message DelFriendRequest {
    int64 from_id = 1;
    int64 to_id = 2;
    int64 msg_id = 3;
    int32 seq = 4;
}

message DelFriendAck {
    int64 code = 1;
    string msg = 2;
    int64 msg_id = 3;
    int32 seq = 4;
}

// ========== 群组管理 ==========
message CreateGroupRequest {
    int64 creator_id = 1;       // 创建者用户ID
    string group_name = 2;      // 群名称
    string group_desc = 3;      // 群描述
}

message CreateGroupAck {
    int64 code = 1;
    string msg = 2;
    int64 group_id = 3;         // 创建成功后服务端分配的群ID
}

message AddGroupRequest {
    int64 user_id = 1;
    int64 group_id = 2;
}

message AddGroupAck {
    int64 code = 1;
    string msg = 2;
}

message QuitGroupRequest {
    int64 user_id = 1;
    int64 group_id = 2;
}

message QuitGroupAck {
    int64 code = 1;
    string msg = 2;
}

message GroupChatRequest {
    int64 from_id = 1;
    int64 group_id = 2;
    string content = 3;
    int64 timestamp = 4;
    int64 msg_id = 5;           // 幂等键
    int32 seq = 6;              // 顺序键
}

message GroupChatAck {
    int64 code = 1;
    string msg = 2;
    int64 msg_id = 3;
    int32 seq = 4;
}

// ========== 跨节点消息转发 ==========
// Redis Pub/Sub传输载体，承载原始消息在节点间转发
// 接收节点解析后查找target_user_id是否在本地_userConnMap中，命中则转发
// msg_id/seq透传：跨节点转发也需保留幂等键与顺序键，确保多节点路径下端到端有序
message CrossNodeMsg {
    int64 target_user_id = 1;   // 目标用户ID（接收节点在本地_userConnMap中查找）
    int32 msg_type = 2;          // 原始消息类型（ONE_CHAT_MSG / GROUP_CHAT_MSG）
    string payload = 3;         // 原始消息序列化字节
    int64 msg_id = 4;           // 幂等键（用于跨节点去重）
    int32 seq = 5;              // 顺序键（用于接收方重排）
    int64 from_id = 6;          // 发送方ID（用于接收方维护per-sender seq）
}
