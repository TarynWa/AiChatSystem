syntax = "proto3";
package chat;

//定义主界面列表

enum EnMsgType{
    LOGIN_MSG = 0; // 登录消息
    LOGIN_MSG_ACK =1; // 登录响应消息
    LOGINOUT_MSG=2; // 注销消息
    REG_MSG=3; // 注册消息
    REG_MSG_ACK=4; // 注册响应消息
    ONE_CHAT_MSG=5; // 聊天消息
    ADD_FRIEND_MSG=6; // 添加好友消息

    CREATE_GROUP_MSG=7; // 创建群组
    ADD_GROUP_MSG=8; // 加入群组
    GROUP_CHAT_MSG=9; // 群聊天
}

message BaseMessage{
    EnMsgType type =1;
    bytes payload = 2;
}