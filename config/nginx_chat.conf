load_module modules/ngx_stream_module.so;

# ============================================================
# ChatSystem Nginx TCP 负载均衡配置
# 聊天系统使用原生TCP（Protobuf over TCP），需使用stream模块
# 客户端连接 nginx:8080 → nginx 转发到后端聊天服务器节点
#
# 启动: sudo nginx -c /home/wangt/ThreadPoolAction/config/nginx_chat.conf
# 停止: sudo nginx -s stop -c /home/wangt/ThreadPoolAction/config/nginx_chat.conf
#       或 sudo kill $(cat /run/nginx_chat.pid)
# ============================================================

worker_processes auto;
error_log  /var/log/nginx_chat_error.log;
pid        /run/nginx_chat.pid;

events {
    worker_connections 1024;
}

stream {
    # 后端聊天服务器集群（muduo服务节点）
    upstream chat_backend {
        # least_conn: 将新连接分配给当前连接数最少的节点（适合长连接聊天场景）
        least_conn;

        # 节点列表（按实际部署修改IP和端口）
        server 127.0.0.1:6000 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6001 max_fails=3 fail_timeout=30s;
        # server 192.168.1.101:6000 max_fails=3 fail_timeout=30s;
        # server 192.168.1.102:6000 max_fails=3 fail_timeout=30s;
    }

    server {
        # nginx对外监听端口，客户端连接此端口
        listen 8080;

        # 代理到后端集群
        proxy_pass chat_backend;

        # 连接超时设置（聊天室为长连接，需设置较长超时）
        proxy_connect_timeout 10s;       # 与后端建立连接的超时
        proxy_timeout 300s;              # 空闲连接超时（5分钟无数据则断开）

        proxy_protocol off;
    }
}
